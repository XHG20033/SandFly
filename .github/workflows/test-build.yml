# Fork-only workflow: build phone-full debug APK for testing.
# Not present in the upstream repository.
name: Test build (phone-full)

on:
  workflow_dispatch:
  push:
    branches: ['test-build']

jobs:
  phone-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number depends on full commit history

      # Pin a fixed debug keystore so consecutive CI builds can be
      # installed over each other (AGP picks it up from ~/.android).
      - name: Install fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # ccache for the native builds (whisper.cpp, Lua, ...).
      - name: Install ccache
        run: command -v ccache || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ccache-test-${{ github.sha }}
          restore-keys: ccache-test-

      - name: Build phone-full debug APK
        run: ./gradlew :assemblePhoneFullDebug

      - uses: actions/upload-artifact@v7
        with:
          name: sandfly-phone-full-debug
          path: talkback/build/outputs/apk/phoneFull/debug/*.apk
